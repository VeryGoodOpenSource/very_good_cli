name: very_good_cli

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/very_good_cli.yaml"
      - "bin/**"
      - "bricks/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/very_good_cli.yaml"
      - "bin/**"
      - "bricks/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
      pull-requests: write
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      runs_on: ${{ matrix.os }}
      flutter_version: "3.47.x"
      coverage_excludes: "**/*.{gen,g}.dart"
      concurrency: 1
      run_skipped: true
      # The CLI's own test suite is run directly rather than through the test optimizer,
      # matching the CI behavior prior to adopting this shared workflow.
      test_optimization: false
      # Run once per workflow so the matrix jobs do not race on the sticky PR comment.
      run_cognitive_complexity: ${{ matrix.os == 'ubuntu-latest' }}
      cognitive_complexity_fail_on_increase: true

  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v2
    with:
      pana_version: 0.22.22
