name: very_good_cli

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/very_good_cli.yaml"
      - "bin/**"
      - "bricks/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/very_good_cli.yaml"
      - "bin/**"
      - "bricks/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
      pull-requests: write
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      runs_on: ${{ matrix.os }}
      flutter_version: "3.47.x"
      coverage_excludes: "**/*.{gen,g}.dart"
      concurrency: 1
      run_skipped: true
      run_bloc_lint: false
      # The CLI's own test suite is run directly rather than through the test optimizer,
      # matching the CI behavior prior to adopting this shared workflow.
      test_optimization: false
      run_cognitive_complexity: true
      # TEMP: `flutter_package.yml@v2` checks the repo out with the default
      # shallow depth, so `kevmoo/analytica.dart` cannot resolve a merge base
      # against `origin/main` and the step exits 1. Pinning the diff base to
      # HEAD skips the merge-base lookup; remove this once the shared workflow
      # checks out with `fetch-depth: 0`.
      cognitive_complexity_diff_base: HEAD

  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v1.21.1
    with:
      pana_version: 0.22.22
