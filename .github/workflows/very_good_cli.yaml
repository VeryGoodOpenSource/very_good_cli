name: very_good_cli

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/very_good_cli.yaml"
      - "bin/**"
      - "bricks/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/very_good_cli.yaml"
      - "bin/**"
      - "bricks/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      runs_on: ${{ matrix.os }}
      flutter_version: "3.47.x"
      coverage_excludes: "**/*.{gen,g}.dart"
      concurrency: 1
      run_skipped: true
      # The CLI's own test suite is run directly rather than through the test optimizer,
      # matching the CI behavior prior to adopting this shared workflow.
      test_optimization: false

  cognitive_complexity:
    # Runs the audit from a dedicated job so the checkout can request full
    # history: `flutter_package.yml@v2` checks the repo out at the default
    # shallow depth, which prevents `kevmoo/analytica.dart` from resolving a
    # merge base against `origin/main` and makes the step exit 1.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.1

      - name: 🧠 Cognitive Complexity
        uses: kevmoo/analytica.dart/packages/cognitive_complexity@main
        with:
          fail-threshold: "15"
          fail-on-increase: "true"

  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v2
    with:
      pana_version: 0.22.22
