name: hooks
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # Kept in sync with the range `test_core` allows, so the hook resolves
  # alongside whatever `package:test` brings in.
  analyzer: ">=13.0.0 <15.0.0"
  mason: ^0.1.0
  path: ^1.8.1

# Beware: on hooks, even dev dependencies have to be compatible to all dart versions covered by
# the sdk constraints above
dev_dependencies:
  mocktail: ^1.0.0
  test: ^1.25.0
  very_good_analysis: ^11.0.0
